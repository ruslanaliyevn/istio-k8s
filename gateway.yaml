---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: http-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
  # HTTP Configuration
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*.example.com"
  # HTTPS Configuration
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: example-tls  # Secret name in istio-system namespace
    hosts:
    - "*.example.com"
